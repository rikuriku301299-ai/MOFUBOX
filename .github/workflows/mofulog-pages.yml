# 一時的なワークフロー: モフログは独立リポジトリへ移転するため、
# 旧URL (github.io/MOFUBOX/) には案内ページだけを残す。
# この後のコミットで MOFUBOX からモフログ関連ファイルごと削除される。
name: Deploy mofulog to GitHub Pages

on:
  push:
    branches:
      - claude/mofubox-landing-page-m98xnw
    paths:
      - ".github/workflows/mofulog-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mofulog-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build moved notice
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta http-equiv="refresh" content="3; url=https://rikuriku301299-ai.github.io/mofulog/">
            <meta name="robots" content="noindex">
            <title>モフログはお引っ越ししました</title>
            <style>
              body { font-family: sans-serif; background: #FDFAF6; color: #2A3736;
                     display: grid; place-items: center; min-height: 100vh; margin: 0; }
              main { text-align: center; padding: 24px; }
              a { color: #2C8C88; }
            </style>
          </head>
          <body>
            <main>
              <h1>モフログはお引っ越ししました</h1>
              <p>3秒後に新しいアドレスへ移動します。</p>
              <p><a href="https://rikuriku301299-ai.github.io/mofulog/">https://rikuriku301299-ai.github.io/mofulog/</a></p>
            </main>
          </body>
          </html>
          HTML
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
